name: Dong goi va phat hanh

# Tu chay khi day code len main: neu APP_VERSION trong viet_hoa.py chua co Release
# thi dong goi exe va dang Release moi (tu tao the vX.Y.Z). Co the bam chay tay trong tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dong-goi:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Doc so phien ban
        id: pb
        shell: pwsh
        run: |
          $v = (Select-String -Path viet_hoa.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "the=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "co_roi=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v da co - bo qua" }
          else { "co_roi=0" >> $env:GITHUB_OUTPUT; Write-Host "Se dang Release v$v" }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-python@v5
        if: steps.pb.outputs.co_roi == '0'
        with:
          python-version: "3.12"

      - name: Cai thu vien
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cryptography

      - name: Dong goi VietHoaGame.exe
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name VietHoaGame
          --icon icon.ico --add-data "icon.ico;." --add-data "danh_muc.json;." --hidden-import viet_hoa_cd --hidden-import crimson_desert --collect-submodules cryptography
          viet_hoa.py

      - name: Tao goi phat hanh
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phat_hanh | Out-Null
          Copy-Item dist/VietHoaGame.exe phat_hanh/VietHoaGame.exe
          Compress-Archive -Force -Path viet_hoa.py,viet_hoa_cd.py,crimson_desert.py,danh_muc.json,icon.ico,chay_thu.bat,HUONG_DAN.txt,cong_cu -DestinationPath phat_hanh/VietHoaGame.zip

      - name: Dang Release
        if: steps.pb.outputs.co_roi == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pb.outputs.the }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          name: Việt Hóa Game ${{ steps.pb.outputs.the }}
          body_path: GHI_CHU_PHAT_HANH.md
          files: |
            phat_hanh/VietHoaGame.exe
            phat_hanh/VietHoaGame.zip
